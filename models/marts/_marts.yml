version: 2

models:
  - name: dim_customers
    description: Customer dimension table.
    columns:
      - name: customer_id
        data_type: string
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: Order fact table.
    columns:
      - name: order_id
        data_type: string
        tests:
          - unique
          - not_null

      - name: customer_id
        data_type: string
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: fct_delivery_performance
    description: |
      Delivery performance fact table.

      Grain: One row per order.

    columns:
      - name: order_id
        description: Unique identifier for each order.
        data_type: string
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Foreign key to dim_customers.
        data_type: string
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: order_date
        description: Date the order was placed.
        data_type: date
        tests:
          - not_null

      - name: customer_region
        description: region of the customer.
        data_type: string
        tests:
          - not_null

      - name: order_size_bucket
        description: Order value classification.
        data_type: string
        tests:
          - accepted_values:
              values: ['Small', 'Medium', 'Large', 'Premium']

      - name: delivery_days
        description: Number of days between shipment and delivery.
        data_type: int64

      - name: is_late_delivery
        description: Whether delivery was late.
        data_type: boolean

      - name: days_late
        description: Number of days delivery was late.
        data_type: int64

      - name: late_delivery_flag
        description: Boolean flag indicating late delivery.
        data_type: boolean

      - name: delivery_category
        description: Delivery classification (Late, On Time, Other).
        data_type: string
        tests:
          - accepted_values:
              values: ['Late', 'On Time', 'Other']


unit_tests:
  - name: test_delivery_classification
    model: fct_delivery_performance

    given:
      - input: ref('int_orders_enriched')
        format: dict
        rows:
          - {order_id: 'o1', customer_id: 'c1', order_date: '2017-01-01', customer_region: 'Southeast', order_size_bucket: 'Small', delivery_days: 5, is_late_delivery: true, days_late: 2, order_status: 'delivered'}

          - {order_id: 'o2', customer_id: 'c2', order_date: '2017-01-02', customer_region: 'South', order_size_bucket: 'Medium', delivery_days: 3, is_late_delivery: false, days_late: 0, order_status: 'delivered'}

    expect:
      format: dict
      rows:
        - {order_id: 'o1', delivery_category: 'Late'}
        - {order_id: 'o2', delivery_category: 'On Time'}